        - despesas c vendas
        - despesas com vendas despesas c pessoal  # multi bucket captions sometimes list pessoal inline
        - vendas

        # --- Broader operational expense captions (safe) ---
        - despesas comerciais
        - despesas administrativas
        - total despesas comerciais gerais e administrativas
        - total de despesas com vendas administrativas e gerais
        - despesas gerais ou administrativas

        # --- Captions that explicitly exclude finance costs (common layout notes) ---
        - despesas operacionais menos despesas financeiras
        - despesas operacionais ex despesas financeiras

