schema_version: '1.0'
normalization_rules:
  - lowercase all aliases
  - remove diacritics (e.g., 'líquida' -> 'liquida')
  - replace '&' with ' e ', '/' with space, '+' with space
  - remove all punctuation except alphanumerics and spaces
  - collapse multiple spaces and trim
