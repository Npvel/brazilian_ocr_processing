# Ground truth for the Stage 1-4 regression harness (harness/run.py).
# Built 2026-11-04 from the reciTAL agent Brazil_OCR202606_V4 (doctype 5485): statement pages from the
# page titles in the OCR words layer, checked against the page images (_recital/<id>/page_<n>.png).
#
# statements: pages of the PRIMARY statements (what the business needs in the Excel).
#   ITR forms carry both perspectives: `consolidated` / `individual` blocks.
# serasa_zone: [page, y] of the "BALANCOS" header and of the first analysis header after
#   "DEMONSTRACOES DOS RESULTADOS". Anything outside = Serasa analysis (indices, evolucao,
#   fluxo de caixa Serasa, indicadores) -> must NOT reach the output (user rule 2026-11-04).
# golden: cells verified by eye on the page image. `fix` = the work step expected to make it pass:
#   now (must already pass), stage1, stage2, export, words (recovery from the OCR words layer).
#   label: normalized substring (anchors_lib.normalize); at: account_type prefix (Contr/Conso) or null.

